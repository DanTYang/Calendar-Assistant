<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signed out — Calendar Assistant</title>
<style>
  :root { --bg:#fbfbfa; --panel:#fff; --ink:#1c1c1a; --muted:#6b6b66; --line:#e4e4df; --accent:#3d6b52; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#191918; --panel:#212120; --ink:#eceae6; --muted:#96968f; --line:#33332f; --accent:#7fb094; }
  }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
    display:grid; place-items:center; padding:1rem;
  }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:.8rem;
    padding:1.6rem 1.8rem; max-width:26rem; text-align:center;
  }
  h1 { font-size:1.1rem; margin:0 0 .5rem; }
  p { color:var(--muted); margin:0 0 1.2rem; }
  a {
    display:inline-block; background:var(--accent); color:#fff;
    text-decoration:none; padding:.55rem 1.1rem; border-radius:.55rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Signed out</h1>
    <p>Your session here has ended. You are still signed in to Google, so
       signing back in will not ask for your password — only for consent.</p>
    <a href="/">Sign in again</a>
  </div>
</body>
</html>
